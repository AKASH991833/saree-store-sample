<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order on WhatsApp — Saree Sansar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body data-page="cart">
<div class="container" id="coRoot"></div>
<script src="assets/js/data.js?v=7"></script>
<script src="assets/js/main.js?v=7"></script>
<script>
function waOrder(){
  const c = SS.getCart();
  const lines = c.map(l => { const p = SS.prod(l.id); return p ? `• ${p.name} x ${l.qty} — ${SS.fmt(p.price*l.qty)}` : ""; }).join("\n");
  const total = c.reduce((s,l) => { const p = SS.prod(l.id); return p ? s + p.price*l.qty : s; }, 0);
  const msg = `Namaste! I would like to order:\n${lines}\nTotal shown on site: ${SS.fmt(total)}\nPlease confirm availability and final total.`;
  const url = SS.whatsappOrder(msg);
  if (url) { open(url, "_blank"); }
  else { SS.toast("Sample only — the shop's WhatsApp number is not connected yet"); }
}
function renderCheckout(){
  const c = SS.getCart();
  if (!c.length){ coRoot.innerHTML = `<div class="empty"><div class="serif">Nothing to order yet</div><p>Add something to your cart first.</p><br><a class="btn btn-maroon" href="shop.html">Shop now</a></div>`; return; }
  let mrp = 0, total = 0;
  const rows = c.map(l => {
    const p = SS.prod(l.id); if (!p) return "";
    mrp += p.mrp*l.qty; total += p.price*l.qty;
    return `<div class="cart-item">
      <a href="product.html?id=${p.id}"><img src="${p.img}" alt="${p.name}"></a>
      <div>
        <div class="ci-name">${p.name}</div>
        <div class="ci-meta">${p.fabric} · ${p.color}</div>
        <div class="ci-price">${SS.fmt(p.price)} × ${l.qty}</div>
      </div>
      <div class="ci-right"><button class="remove" onclick="SS.setCart(SS.getCart().filter(x=>x.id!=='${p.id}'));renderCheckout()">Remove</button></div>
    </div>`;
  }).join("");
  coRoot.innerHTML = `<div class="cart-wrap">
    <div>
      <h2 class="serif" style="color:var(--maroon-dark);margin-bottom:.4rem">Order on WhatsApp</h2>
      <p style="font-size:.9rem;color:#453a3d;margin-bottom:1.1rem">No login, no forms. One tap opens your WhatsApp with this order already written — you just press send. The shop confirms availability and the final total in chat. Name and address are shared in chat only if you want home delivery; pickup needs no address.</p>
      ${rows}
    </div>
    <div class="summary">
      <h3>Order summary</h3>
      <div class="srow"><span>Total MRP</span><span>${SS.fmt(mrp)}</span></div>
      <div class="srow"><span>Discount on MRP</span><span style="color:var(--green);font-weight:700">− ${SS.fmt(mrp-total)}</span></div>
      <div class="srow"><span>Delivery</span><span>Confirmed on WhatsApp</span></div>
      <div class="srow total"><span>Total</span><span>${SS.fmt(total)}</span></div>
      <button class="btn btn-maroon" style="width:100%" onclick="waOrder()">Send order on WhatsApp</button>
      <p style="font-size:.72rem;color:var(--muted);text-align:center;margin-top:.6rem">Sample — not connected to a shop number yet; payment as usual (cash / UPI), confirmed in chat</p>
    </div>
  </div>`;
}
document.addEventListener("DOMContentLoaded", renderCheckout);
</script>
</body>
</html>
