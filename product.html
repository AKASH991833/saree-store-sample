<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saree — Saree Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="shop">
<div class="container">
  <nav class="crumbs"><a href="index.html">Home</a> › <a href="shop.html">Shop</a> › <span id="crumbCat"></span></nav>
  <div class="pd-wrap">
    <div class="pd-img"><div class="frame"><img id="pdImg" src="" alt=""></div></div>
    <div class="pd-info">
      <h1 id="pdName"></h1>
      <div class="pd-rate" id="pdRate"></div>
      <div class="pd-price" id="pdPrice"></div>
      <div class="tax-note">Sample price · AI-generated demo photo, not actual inventory</div>
      <div class="offer-box"><h4>Sample offers</h4><ul>
        <li>Festive discount already applied — no coupon needed</li>
        <li>Free delivery on every order in this sample</li>
        <li>7-day easy exchange (sample policy)</li>
      </ul></div>
      <table class="spec-table" id="specs"></table>
      <div class="delivery">
        <input id="pin" inputmode="numeric" maxlength="6" placeholder="Enter delivery PIN code">
        <button onclick="checkPin()">Check</button>
      </div>
      <div class="pin-result" id="pinResult"></div>
      <div class="pd-actions">
        <span class="qty"><button onclick="chQty(-1)">−</button><span id="qty">1</span><button onclick="chQty(1)">+</button></span>
        <button class="btn btn-outline" onclick="addCart()">Add to cart</button>
        <button class="btn btn-maroon" onclick="waSingle()">Order on WhatsApp</button>
      </div>
      <div class="pd-hl"><h4>Highlights</h4><ul id="hl"></ul></div>
      <p style="margin-top:1rem;color:#453a3d;font-size:.94rem" id="pdDesc"></p>
      <div class="reviews" id="reviews"></div>
    </div>
  </div>
  <section class="block"><div class="sec-head"><span class="kick">You may also like</span><h2>Similar sarees</h2><div class="flourish">✦</div></div>
    <div class="pgrid" id="similar"></div>
  </section>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
const p = SS.prod(id) || PRODUCTS[0];
let q = 1;
function chQty(d){ q = Math.max(1, Math.min(10, q + d)); qty.textContent = q; }
function addCart(){ SS.addToCart(p.id, q); }
function waSingle(){
  const msg = `Namaste! I would like to order: ${p.name} x ${q} — ${SS.fmt(p.price*q)}. Please confirm availability and final total.`;
  const url = SS.whatsappOrder(msg);
  if (url) open(url, "_blank");
  else SS.toast("Sample only — the shop's WhatsApp number is not connected yet");
}
function checkPin(){
  const v = pin.value.trim();
  if (!/^\d{6}$/.test(v)) { pinResult.textContent = "Enter a valid 6-digit PIN code"; pinResult.style.color = "#b3261e"; return; }
  const d = new Date(Date.now() + 4*864e5);
  pinResult.style.color = "";
  pinResult.textContent = `Delivery to ${v} by ${d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})} — sample estimate`;
}
document.addEventListener("DOMContentLoaded", () => {
  document.title = p.name + " — Saree Studio";
  crumbCat.innerHTML = `<a href="shop.html?cat=${encodeURIComponent(p.category)}">${p.category}</a>`;
  pdImg.src = p.img; pdImg.alt = p.name;
  pdName.textContent = p.name;
  pdRate.innerHTML = `<span class="pill">${p.rating} ★</span><span>${p.ratings} sample ratings</span>`;
  pdPrice.innerHTML = `<span class="now">${SS.fmt(p.price)}</span><span class="was">${SS.fmt(p.mrp)}</span><span class="off">${SS.off(p)}% off</span>`;
  specs.innerHTML = [["Fabric",p.fabric],["Colour",p.color],["Collection",p.category],["Blouse piece","Included (unstitched)"],["Care","See highlights"]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
  hl.innerHTML = p.highlights.map(h => `<li>${h}</li>`).join("");
  pdDesc.textContent = p.desc;
  const rv = DEMO_REVIEWS[p.id] || [["Happy customer", 4, "Lovely fabric and colour — matches the photos. (sample review)"]];
  reviews.innerHTML = `<h4 style="font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--maroon);margin-bottom:.4rem">Sample reviews</h4>` +
    rv.map(r => `<div class="review"><div class="who">${r[0]} <span class="stars">${"★".repeat(r[1])}${"☆".repeat(5-r[1])}</span></div><p style="font-size:.88rem;color:#453a3d">${r[2]}</p></div>`).join("");
  similar.innerHTML = PRODUCTS.filter(x => x.id !== p.id).sort((a,b) => (b.category===p.category)-(a.category===p.category)).slice(0,4).map(SS.cardHTML).join("");
  SS.observeReveals();
});
</script>
</body>
</html>
